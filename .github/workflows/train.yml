name: Train Q-DOOM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Flow
        uses: actions/checkout@v4
        with:
          repository: flooooooooooow/flow
          path: flow

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang python3 python3-pip
          python3 -m pip install --user -r flow/requirements.txt
          # flow's python compile path omits -lm; Linux needs it for libm.
          mkdir -p "$HOME/.local/bin"
          printf '%s\n' '#!/bin/bash' 'exec /usr/bin/clang "$@" -lm' > "$HOME/.local/bin/clang"
          chmod +x "$HOME/.local/bin/clang"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Train and gate on baseline
        env:
          FLOW_HOST: python
        run: |
          chmod +x flow/flow
          ./flow/flow run q_doom.flow
